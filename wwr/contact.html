<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="WildCurrent Adventures offers exciting whitewater rafting trips, breathtaking river experiences, and unforgettable outdoor adventures.">
    <meta name="Contact Us" content="Paul Olaniyi">
    <title>WildCurrent Adventures - Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-boat-splash.png" alt="Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about-us.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h3>WildCurrent Adventures</h3>
            <p>456 Clear River Road</p>
            <p>Bueno Vista, CO 81210</p>
            <p> <a href="tel:+17195550199">+1 (719) 555-0329</a></p>
            <p><a href="mailto:info@wildcurrentadventures.com">info@wildcurrentadventures.com</a>
            </p>
        </section>

        <section class="contact-layout">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d759.7051424132334!2d-105.46019270000001!3d40.3906692!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8769662c144b79af%3A0xfcfb3b048bfe6c1!2s456%20Canyon%20River%20Rd%2C%20Drake%2C%20CO%2080515%2C%20USA!5e0!3m2!1sen!2sng!4v1785755055529!5m2!1sen!2sng"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="contact-form">
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                      placeholder="wildcurrentadventures.com">

                    <label class="purpose-label">Message <br> Purpose</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general">
                            <label for="general">General Inquiry</label>
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>

                    <label class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>


        <section>
            <h2>We Are Here to Serve You!</h2>

            <div class="employee">
                <figure>
                    <img src="images/employee1.jpg" alt="employee image 1">
                    <figcaption>General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="employee image 2">
                    <figcaption>Gear Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="employee image 3">
                    <figcaption>Support Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee4.jpg" alt="employee image 4">
                    <figcaption>Reservations Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 WildCurrent Adventures, Paul Olaniyi</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook logo">
            </a>
            <a href="https://www.youtube.com">
                <img src="images/youtube.svg" alt="Youtube logo">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.svg" alt="Twitter logo">
            </a>
        </nav>
    </footer>
</body>

</html>
